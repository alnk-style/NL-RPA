schema_version: 1
id: generic_desktop
name: Generic Desktop
version: "0.1.0"
description: Generic Windows desktop control through the existing Desktop Bridge.
platform: windows
backend_priority:
  - desktop
entrypoint: "adapter:GenericDesktopAdapter"
config:
  connector: desktop
local:
  host_mode: in_process
  auto_start: false
  startup_timeout_seconds: 5
tools:
  - name: desktop_probe
    description: Probe desktop Agent connectivity and available actions.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    risk_level: read_only
    output_description: Desktop Agent connection and capability status.
  - name: desktop_observe
    description: Observe desktop windows and UI Automation elements.
    input_schema:
      type: object
      properties:
        title:
          type: string
        class_name:
          type: string
        pid:
          type: integer
        include_windows:
          type: boolean
        max_elements:
          type: integer
          minimum: 1
          maximum: 1000
        depth:
          type: integer
          minimum: 1
          maximum: 20
      additionalProperties: false
    risk_level: read_only
    output_description: Desktop windows, elements and observation metadata.
  - name: desktop_launch
    description: Launch a program through the existing Desktop Agent allowlist.
    input_schema:
      type: object
      properties:
        path:
          type: string
          minLength: 1
        args:
          type: array
          items:
            type: string
        wait_for_window:
          type: boolean
        window_timeout:
          type: number
          exclusiveMinimum: 0
      required:
        - path
      additionalProperties: false
    risk_level: mutating
    output_description: Desktop Agent task output and step logs.
  - name: desktop_activate
    description: Activate a desktop window through UI Automation.
    input_schema:
      type: object
      properties:
        title:
          type: string
        class_name:
          type: string
        pid:
          type: integer
        index:
          type: integer
          minimum: 0
      additionalProperties: false
    risk_level: mutating
    output_description: Desktop Agent task output and step logs.
  - name: desktop_read_text
    description: Read text from a UI Automation control.
    input_schema:
      type: object
      properties:
        automation_id:
          type: string
        name:
          type: string
        control_type:
          type: string
      additionalProperties: false
    risk_level: read_only
    output_description: Text and metadata returned by the Desktop Agent.
